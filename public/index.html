<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script type="importmap">
{
    "imports": {
        "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
    }
}
</script>
</head>
<body>
    <a href="/statystyki.html" style="position:fixed;z-index:1000;top:16px;right:16px;padding:12px 16px;border-radius:8px;background:#102536;color:#fff;font:600 14px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 12px #0005">Statystyki dnia ↗</a>
	<style>
.plane-div-icon {
    background: transparent;
    border: none;
}

.plane-marker {
    width: 36px;
    height: 36px;
    filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.65));
    transform-origin: center;
}
	</style>
	<div id="map" style="height: 800px"></div>
	<script type="module">
	   import * as L from 'leaflet';
		// the map code goes here

       const map = L.map('map').setView([50.28778, 21.43167], 13);
		const markers = new Map();
		
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);



function createPlaneIcon(track) {
    return L.divIcon({
        className: 'plane-div-icon',
        html: `
            <svg
                class="plane-marker"
                viewBox="0 0 24 24"
                style="transform: rotate(${Number(track) || 0}deg)"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M12 1
                    L13.2 9
                    L21 14
                    L21 16
                    L13.2 13.5
                    L13 21
                    L15 23
                    L15 24
                    L12 22.5
                    L9 24
                    L9 23
                    L11 21
                    L10.8 13.5
                    L3 16
                    L3 14
                    L10.8 9
                    Z"
                    fill="#ffffff"
                />
            </svg>
        `,
        iconSize: [36, 36],
        iconAnchor: [18, 18]
    });
}
async function getPlanes() {
    try {
        const response = await fetch('/api/planes');
        const data = await response.json();

        // Zapamiętujemy samoloty widoczne w aktualnym odczycie
        const activePlanes = new Set();

        data.aircraft.forEach(plane => {

            if (
                !plane.hex ||
                typeof plane.lat !== 'number' ||
                typeof plane.lon !== 'number'
            ) return;

            // Pomijamy pozycje starsze niż 60 sekund
            if (
                typeof plane.seen_pos === 'number' &&
                plane.seen_pos > 60
            ) return;

            activePlanes.add(plane.hex);

            if (markers.has(plane.hex)) {
                const marker = markers.get(plane.hex);

                marker.setLatLng([plane.lat, plane.lon]);
                marker.setIcon(createPlaneIcon(plane.track));

            } else {
                const newMarker = new L.Marker(
                    [plane.lat, plane.lon],
                    { icon: createPlaneIcon(plane.track) }
                ).addTo(map);

                markers.set(plane.hex, newMarker);
            }
        });

        // Usuwamy markery samolotów, których nie ma w aktualnych danych
        for (const [hex, marker] of markers) {
            if (!activePlanes.has(hex)) {
                map.removeLayer(marker);
                markers.delete(hex);
            }
        }

    } catch (error) {
        console.error('Błąd pobierania samolotów:', error);
    }
}

getPlanes();
setInterval(getPlanes, 1500);


	</script>
</body>
</html>
